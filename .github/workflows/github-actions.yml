name: build
on: [push, pull_request]
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.13'
    - name: install dependencies
      run: uv sync --locked
    - name: lint, format, types
      run: |
        uv run ruff check
        uv run ruff format --check
        uv run mypy .

  test:
    name: py313 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.13'
    - name: install dependencies
      run: uv sync --locked
    - name: test
      run: uv run pytest
