name: build
on: [push, pull_request]
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'check'
            python: '3.13'
            toxpython: 'python3.13'
            tox_env: 'check'
            os: 'ubuntu-latest'

          - name: 'py313 (ubuntu)'
            python: '3.13'
            toxpython: 'python3.13'
            python_arch: 'x64'
            tox_env: 'py313'
            os: 'ubuntu-latest'

          - name: 'py313 (macos)'
            python: '3.13'
            toxpython: 'python3.13'
            python_arch: 'x64'
            tox_env: 'py313'
            os: 'macos-latest'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        architecture: ${{ matrix.python_arch }}
    - name: install dependencies
      run: |
        python -mpip install --progress-bar=off pipenv
        pipenv install --dev
    - name: test
      env:
        TOXPYTHON: '${{ matrix.toxpython }}'
      run: >
        pipenv run tox -e ${{ matrix.tox_env }} -v
