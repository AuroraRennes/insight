# ===================================================
# Project information
# ===================================================
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "insight"
description = "CoreSight/OpenCSD Trace parser and annotation interpreter"
version = "0.0.0"
requires-python = ">= 3.13"
dependencies = [
    "capstone",
    "pyelftools",
    "unicorn",
]

[project.scripts]
insight = "insight.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-mock",
    "ruff",
]

# ===================================================
# Setuptools
# ===================================================

[tool.setuptools.packages.find]
include = ["insight*"]

# ===================================================
# Mypy - type hints
# ===================================================

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

# ===================================================
# Ruff - linter
# ===================================================

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "helpers/",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 110
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D", "FIX", "TD",  # Docstring, fixmes, todos
    "TRY301",  # Raising exceptions and catching it in the same try block
    "ERA001",  # Commented-out code
    "A002",    # built-in argument shadowing
    "PLR0913", # too many arguments
    "G004",    # f-string in logging messages
    "COM812",  # check for trailing commas
    "ISC001",   # implicit concatenate strings
    "PLR2004", # Magic values
    "CPY001",  # Copyright notices
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Ignore unused variadic arguments
flake8-unused-arguments.ignore-variadic-names = true

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = [
    "PT021",
    "ANN001", "ANN201", # Typing annotations not necessary
    "S101", # Asserts allowed in tests
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
]

# ===================================================
# Pytest - testing
# ===================================================

[tool.pytest.ini_options]
addopts = "-v -ra -q"
testpaths = ["tests"]
python_files = ["conftest.py", "test_*.py"]
