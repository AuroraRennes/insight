# ===================================================
# Project information
# ===================================================
[build-system]
requires = [
    "capstone",
    "setuptools"
]

[project]
name = "onsight"
description = "CoreSight/OpenOCD trace handler"
version = "0.0.0"
requires-python = ">= 3.12"

# ===================================================
# Setuptools
# ===================================================

[tool.setuptools]
py-modules = ["onsight"]

# ===================================================
# Mypy - type hints
# ===================================================

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

# ===================================================
# Ruff - linter
# ===================================================

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D", "FIX", "TD",
    "TRY301", "ERA001", "A002", "PLR0913",
    "G004", "COM812", "ISC001"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = [
    "PT021",
    "ANN001", "ANN201", # Typing annotations not necessary
    "S101", # Asserts allowed in tests
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
]

# ===================================================
# Tox - ci
# ===================================================

# Unsupported for the moment, but can be passed through legacy_tox_ini
# FIXME: update when released
[tool.tox]
legacy_tox_ini = """
[tox]
envlist = check, py312

; Base tests
[testenv]
passenv = *
deps = pytest
commands =
    pytest -s

; Linting and import tests with flake, black and isort
[testenv:check]
passenv = *
basepython = python3.12
deps =
    ruff
    mypy
commands =
    ruff check --fix
    ruff format
    mypy onsight
"""



# ===================================================
# Pytest - testing
# ===================================================

[tool.pytest.ini_options]
addopts = "-v -ra -q"
testpaths = ["tests"]
python_files = ["conftest.py", "test_*.py"]
