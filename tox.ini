[tox]
envlist = check, py313

; Base tests
[testenv]
passenv = *
deps = pipenv
commands =
    pipenv install --dev
    pipenv run pytest -s

; linting with ruff, types with mypy
[testenv:check]
passenv = *
basepython = python3.13
deps = pipenv
commands =
    pipenv install --dev
    pipenv run ruff check --fix
    pipenv run ruff format
    pipenv run mypy .